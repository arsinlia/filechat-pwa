<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>چت با فایل</title>
  <meta name="theme-color" content="#b8912a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">

  <!-- ===== صفحه‌ی گفتگو ===== -->
  <section id="scr-chat" class="screen">
    <header>
      <button id="btnMenu" class="ic" data-i18n-title="chats">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <div class="htitle">
        <h1 data-i18n="appTitle">چت با فایل</h1>
        <div id="hdrModel" class="hmodel" dir="auto"></div>
      </div>
      <span class="sp"></span>
      <button id="btnInstall" class="txt" hidden data-i18n="install">نصب برنامه</button>
      <button id="btnNewTop" class="ic" data-i18n-title="newChat">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
      </button>
      <button id="btnSettings" class="ic" data-i18n-title="settings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94c0-.32-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.74 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.31-.07.63-.07.94s.02.63.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
    </header>

    <main id="chat"></main>

    <div id="errbar" hidden></div>
    <div id="chips"></div>
    <div id="quick">
      <button type="button" data-q="فایل‌های پیوست را خلاصه کن و مهم‌ترین نکاتشان را بگو." data-i18n="qSummary">خلاصه‌ی فایل‌ها</button>
      <button type="button" data-q="نکات کلیدی و مهم‌ترین اعداد و نتایج فایل‌های پیوست را استخراج کن." data-i18n="qKeys">نکات کلیدی</button>
      <button type="button" data-q="فایل‌های پیوست را از نظر خطا، ایراد و ناسازگاری بررسی کن." data-i18n="qIssues">بررسی ایرادها</button>
    </div>

    <footer class="composer">
      <button id="btnAttach" class="ic" data-i18n-title="attach">
        <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6z"/></svg>
      </button>
      <button id="btnModel" class="modelchip" dir="ltr"></button>
      <textarea id="input" rows="1"></textarea>
      <button id="btnSend" class="ic primary" data-i18n-title="send">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
      <button id="btnStop" class="ic danger" data-i18n-title="stop" hidden>
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
      </button>
    </footer>
  </section>

  <!-- ===== تنظیمات ===== -->
  <section id="scr-settings" class="screen" hidden>
    <div class="shead">
      <button class="ic" data-back="chat"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
      <h2 data-i18n="settings">تنظیمات</h2>
    </div>
    <div class="sbody">
      <button class="srow" id="rowAi"><span data-i18n="aiSettings">تنظیمات هوش مصنوعی</span><span class="chev">‹</span></button>

      <div class="scard">
        <label class="flabel"><span data-i18n="systemPrompt">پرامپت سیستمی</span>
          <textarea id="gPrompt" rows="4"></textarea>
        </label>
        <label class="flabel"><span><span data-i18n="temperature">دمای پاسخ (خلاقیت)</span>: <span id="gTempVal">1</span></span>
          <input type="range" id="gTemp" min="0" max="1" step="0.05">
        </label>
        <label class="frow"><input type="checkbox" id="gPdfImg"> <span data-i18n="pdfImg"></span></label>
        <label class="frow"><input type="checkbox" id="memToggle"> <span><span data-i18n="memory">حافظه‌ی گفتگو</span> — <small data-i18n="memoryHint"></small></span></label>
      </div>

      <button class="srow" id="rowAppearance"><span data-i18n="appearance">ظاهر و رنگ</span><span class="chev">‹</span></button>

      <div class="scard">
        <label class="flabel"><span data-i18n="language">زبان</span>
          <select id="langSel">
            <option value="fa">فارسی</option>
            <option value="en">English</option>
            <option value="ar">العربية</option>
          </select>
        </label>
      </div>

      <button class="srow" id="rowAbout"><span data-i18n="about">درباره</span><span class="chev">‹</span></button>
      <button class="srow danger-t" id="clearData"><span data-i18n="clearData">پاک کردن همه‌ی داده‌ها</span></button>
    </div>
  </section>

  <!-- ===== تنظیمات هوش مصنوعی ===== -->
  <section id="scr-ai" class="screen" hidden>
    <div class="shead">
      <button class="ic" data-back="settings"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
      <h2 data-i18n="aiSettings">تنظیمات هوش مصنوعی</h2>
    </div>
    <div class="sbody">
      <button class="srow" id="rowProviders"><span data-i18n="providers">ارائه دهندگان هوش مصنوعی</span><span class="chev">‹</span></button>
    </div>
  </section>

  <!-- ===== ارائه‌دهندگان ===== -->
  <section id="scr-providers" class="screen" hidden>
    <div class="shead">
      <button class="ic" data-back="ai"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
      <h2 data-i18n="providers">ارائه دهندگان هوش مصنوعی</h2>
    </div>
    <div class="sbody">
      <div id="provList"></div>
      <button class="btn wide" id="addProvider" data-i18n="addProvider">افزودن ارائه‌دهنده</button>
    </div>
  </section>

  <!-- ===== فرم ارائه‌دهنده ===== -->
  <section id="scr-provform" class="screen" hidden>
    <div class="shead">
      <button class="ic" data-back="providers"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
      <h2 data-i18n="addProvider">افزودن ارائه‌دهنده</h2>
    </div>
    <div class="sbody">
      <div class="scard">
        <label class="flabel"><span data-i18n="pName">نام ارائه‌دهنده</span>
          <input id="pfName" autocomplete="off" spellcheck="false">
        </label>
        <label class="flabel"><span data-i18n="pType">نوع API</span>
          <select id="pfType">
            <option value="openai">OpenAI و سازگارها (OpenRouter، AnyRouter، DeepSeek، ...)</option>
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="gemini">Google Gemini</option>
          </select>
        </label>
        <label class="flabel"><span data-i18n="pBase">Base URL</span>
          <input id="pfBase" dir="ltr" autocomplete="off" spellcheck="false">
          <small id="pfHint"></small>
        </label>
        <label class="flabel"><span data-i18n="pKey">API Key</span>
          <input id="pfKey" dir="ltr" type="password" autocomplete="off" spellcheck="false">
        </label>
        <label class="frow"><input type="checkbox" id="pfShow"> <span data-i18n="showKey">نمایش کلید</span></label>
        <label class="flabel"><span data-i18n="pModel">نام مدل</span>
          <input id="pfModel" dir="ltr" autocomplete="off" spellcheck="false">
        </label>
        <button type="button" id="pfLoad" class="btn" data-i18n="loadModels">بارگزاری مدلها</button>
        <div id="pfModels" class="modellist" hidden></div>
        <small id="pfModelsMsg"></small>
        <div class="actions">
          <button type="button" id="pfCancel" class="txt" data-i18n="cancel">انصراف</button>
          <span class="sp"></span>
          <button type="button" id="pfSave" class="btn" data-i18n="save">ذخیره</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== ظاهر و رنگ ===== -->
  <section id="scr-appearance" class="screen" hidden>
    <div class="shead">
      <button class="ic" data-back="settings"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
      <h2 data-i18n="appearance">ظاهر و رنگ</h2>
    </div>
    <div class="sbody">
      <div class="scard">
        <div class="flabel"><span data-i18n="theme">تم</span>
          <div class="seg" id="themeSeg">
            <button data-theme-val="system" data-i18n="themeSystem">سیستم</button>
            <button data-theme-val="light" data-i18n="themeLight">روشن</button>
            <button data-theme-val="dark" data-i18n="themeDark">تیره</button>
          </div>
        </div>
        <div class="flabel"><span data-i18n="colorMe">رنگ حباب پیام‌های من</span>
          <div class="swrow"><div class="swgrid" id="sw-me"></div><input type="color" id="cp-me"></div>
        </div>
        <div class="flabel"><span data-i18n="colorAi">رنگ حباب پاسخ‌ها</span>
          <div class="swrow"><div class="swgrid" id="sw-ai"></div><input type="color" id="cp-ai"></div>
        </div>
        <div class="flabel"><span data-i18n="colorAccent">رنگ اصلی (دکمه‌ها)</span>
          <div class="swrow"><div class="swgrid" id="sw-accent"></div><input type="color" id="cp-accent"></div>
        </div>
        <button class="txt" id="resetColors" data-i18n="resetColors">بازگردانی رنگ‌های پیش‌فرض</button>
      </div>
    </div>
  </section>

  <!-- ===== درباره ===== -->
  <section id="scr-about" class="screen" hidden>
    <div class="shead">
      <button class="ic" data-back="settings"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>
      <h2 data-i18n="about">درباره</h2>
    </div>
    <div class="sbody">
      <div class="scard">
        <p data-i18n="aboutText"></p>
        <p class="muted" data-i18n="version">نسخه ۵٫۰</p>
      </div>
    </div>
  </section>
</div>

<!-- منوی کناری گفتگوها -->
<div id="scrim" hidden></div>
<aside id="drawer">
  <div class="dhead"><h2 data-i18n="chats">گفتگوها</h2></div>
  <button class="btn wide" id="drawerNew" data-i18n="newChat">گفتگوی جدید</button>
  <div id="threadList"></div>
  <div class="dfoot"><button class="srow" id="drawerSettings"><span data-i18n="settings">تنظیمات</span><span class="chev">‹</span></button></div>
</aside>

<!-- کشوی انتخاب مدل -->
<div id="modelSheet">
  <div class="mhead"><h2 data-i18n="chooseModel">انتخاب مدل</h2></div>
  <input id="modelSearch" data-i18n-ph="searchModels" placeholder="جستجوی مدل...">
  <div id="modelGroups"></div>
</div>

<input type="file" id="file" multiple hidden>

<dialog id="viewDlg">
  <div class="vhead"><h2 id="viewTitle"></h2><button type="button" id="viewClose" class="txt" data-i18n="close">بستن</button></div>
  <pre id="viewText" dir="auto"></pre>
  <div class="actions"><button type="button" id="viewToggle" class="btn"></button></div>
</dialog>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
